<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%"
  height="100%">
  <style>
  .reticle-base {
    fill: none;
    stroke: #FF0000;
    stroke-width: 4;
    stroke-linecap: round;
  }
  .reticle-center {
    fill: #FF0000;
  }
  </style>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="35" class="reticle-base" />

  <!-- Center Dot -->
  <circle cx="50" cy="50" r="2" class="reticle-center" />

  <!-- Crosshairs -->
  <line x1="50" y1="10" x2="50" y2="32" class="reticle-base" />
  <line x1="50" y1="68" x2="50" y2="90" class="reticle-base" />
  <line x1="10" y1="50" x2="32" y2="50" class="reticle-base" />
  <line x1="68" y1="50" x2="90" y2="50" class="reticle-base" />
</svg>
